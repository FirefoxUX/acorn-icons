name: "Post PR notice"
description: >-
  Upserts a sticky PR comment from a JSON payload, without writing a commit
  status. For advice the author can act on or ignore; post-feedback is the one
  to use when the check should go red.

inputs:
  marker:
    description: >-
      Hidden HTML comment used to locate the sticky comment on the PR.
      Use a distinct value per notice so several cannot clobber each other
      (e.g. "<!-- acorn-icons-bot:categories-reminder -->").
    required: true
  notice_path:
    description: >-
      Absolute path to the JSON payload. When the file is absent any existing
      comment is removed, so a notice disappears once it no longer applies.
    required: true
  github_token:
    description: "Token used for the GitHub API calls."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Upsert sticky comment
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        NOTICE_PATH: ${{ inputs.notice_path }}
        MARKER: ${{ inputs.marker }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs')

          const marker = process.env.MARKER
          const noticePath = process.env.NOTICE_PATH

          let payload = null
          try {
            payload = JSON.parse(fs.readFileSync(noticePath, 'utf8'))
          } catch (err) {
            if (err.code !== 'ENOENT') {
              core.warning(`Could not read notice payload at ${noticePath}: ${err.message}`)
            }
          }

          const pr = context.payload.pull_request
          if (!pr) {
            core.info('Not a pull_request event, skipping comment.')
            return
          }

          const owner = context.repo.owner
          const repo = context.repo.repo
          const issue_number = pr.number

          const comments = await github.paginate(
            github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 },
          )
          const existing = comments.find((c) => c.body && c.body.includes(marker))

          if (!payload) {
            if (existing) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id,
              })
            }
            return
          }

          const body = [marker, `**${payload.title}**`, '', payload.body].join('\n')

          // Editing rather than replacing matters: GitHub notifies on a new
          // comment but not on an edit, so the author hears about this once
          // however many times they push.
          if (existing) {
            if (existing.body !== body) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              })
            }
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            })
          }
